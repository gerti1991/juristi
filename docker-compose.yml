version: '3.8'

services:
  juristi-ai:
    build: .
    container_name: juristi-ai
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app/src
      - EMBEDDING_PROVIDER=sentence-transformers
      - DEVICE=cpu
      - VERBOSE=true
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./legal_documents:/app/legal_documents
      - ./.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
