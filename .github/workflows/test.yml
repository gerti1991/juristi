name: Juristi AI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v
    
    - name: Test imports
      run: |
        python -c "from src.juristi.core.rag_engine import AlbanianLegalRAG; print('✅ Core imports successful')"
        python -c "from src.juristi.api.main import app; print('✅ API imports successful')"

  next-js-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ui-nextjs/package-lock.json
    
    - name: Install Next.js dependencies
      working-directory: ui-nextjs
      run: npm ci
    
    - name: Build Next.js application
      working-directory: ui-nextjs
      run: npm run build
    
    - name: Run Next.js tests
      working-directory: ui-nextjs
      run: npm test --if-present
